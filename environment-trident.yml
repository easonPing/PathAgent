name: pathagent-trident
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - openslide
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.0+cu128
      - torchvision==0.22.0+cu128
      - timm==0.9.16
      - transformers==4.51.0
      - numpy<2
      - segmentation-models-pytorch==0.4.0
      - -e ./external/TRIDENT
